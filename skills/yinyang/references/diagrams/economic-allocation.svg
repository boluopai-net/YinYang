<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Where should finite resources go?</title>
<desc id="desc">Time, attention, bodily energy, and money support personal cultivation, model assistance, and support and recovery. Outcomes, developing capacities, and total costs inform revised allocation. Neural and bodily, psychological, and social conditions shape the arrangement. Arrows denote relationships.</desc>
