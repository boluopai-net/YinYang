<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">有限投入，怎样分配？</title>
<desc id="desc">时间、注意力、身体精力和费用，支持亲自培养、借用模型以及支持与恢复。比较生活所得、能力发展和总成本，重新选择投入与分工。神经与身体、心理与选择、社会与制度共同影响这一安排。箭头表示关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#536461" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" rx="12" fill="#faf9f5"/>
<style>text{font-family:Helvetica Neue,PingFang SC,sans-serif;fill:#243c3b}.sub{fill:#536461;font-size:19px}.title{font-size:25px;font-weight:600}.path{fill:none;stroke:#536461;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<text x="52" y="57" font-size="34" font-weight="600" text-anchor="start" style="fill:#243c3b">有限投入，怎样分配？</text>
<text x="52" y="93" font-size="20" font-weight="400" text-anchor="start" style="fill:#536461">个人递归自改进 · 让选择投入的方法也能改善</text>
