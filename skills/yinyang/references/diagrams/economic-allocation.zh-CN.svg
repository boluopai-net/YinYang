<text x="600" y="744" font-size="21" font-weight="500" text-anchor="middle" style="fill:#243c3b">神经与身体 · 心理与选择 · 社会与制度</text>
<text x="600" y="777" font-size="17" font-weight="400" text-anchor="middle" style="fill:#536461">三种视角共同解释投入的条件与价值；各项资源分别比较。</text>
